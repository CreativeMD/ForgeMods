plugins {
    id 'net.darkhax.curseforgegradle' version '1.3.+'
}

import groovy.json.*
import java.util.jar.*;
import org.gradle.api.artifacts.*;
import org.gradle.api.artifacts.transform.TransformParameters;

abstract class DisableMod implements TransformAction<TransformParameters.None> {

    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()
    
    @Inject
    abstract ArchiveOperations getArchiveOperations()

    @Override
    void transform(TransformOutputs outputs) {
        var originalJar = inputArtifact.get().asFile
        if(!originalJar.exists())
            return
        var isMod = getArchiveOperations().zipTree(originalJar).any { it.name == "fabric-installer.json" || it.name == "neoforge.mods.toml" || it.name == "fabric.mod.json" }
        if (isMod) {
            var target = outputs.file(originalJar.name.replace(".jar", "-disabled.jar"))
            var input = new JarInputStream(originalJar.newInputStream())
            var output = new JarOutputStream(target.newOutputStream())
            var jarEntry = input.nextJarEntry
            while (jarEntry != null) {
                if(!jarEntry.name.startsWith("META-INF/") && jarEntry.name != "META-INF/neoforge.mods.toml" && jarEntry.name != "fabric.mod.json") {
                    output.putNextEntry(jarEntry)
                    output.write(input.readAllBytes())
                    output.closeEntry()
                }
                jarEntry = input.nextJarEntry
            }
            output.closeEntry()
            output.close()
            input.close()
            outputs.file(target)
            return
        }
        outputs.file(inputArtifact)
    }
    
}

var noMod = Attribute.of("noMod", Boolean)

gradle.afterProject { project ->
    if (project != rootProject) {
    
        project.configurations {
            var parent = implementation
            modCompileOnly {
                canBeConsumed = false
                canBeResolved = false
                transitive = false
                attributes.attribute(noMod, true)
                
                // Copied from https://github.com/neoforged/ModDevGradle/blob/main/src/legacy/java/net/neoforged/moddevgradle/legacyforge/dsl/Obfuscation.java#L122
                // Unfortunately, if we simply try to make the parent extend this config, transformations will not run because the parent doesn't request remapped deps
                // If the parent were to request remapped deps, we'd be remapping everything in it.
                // Therefore, we use a slight "hack" that imposes a constraint over all dependencies in this configuration: to be remapped.
                // Additionally, we force dependencies to be non-transitive since we cannot apply the attribute hack to transitive dependencies.
                withDependencies(dependencies -> dependencies.each { dep -> 
                    if (dep instanceof ExternalModuleDependency) {
                        ExternalModuleDependency externalModuleDependency = (ExternalModuleDependency) dep;
                        project.getDependencies().constraints(constraints -> {
                            constraints.add(parent.getName(), externalModuleDependency.getGroup() + ":" + externalModuleDependency.getName() + ":" + externalModuleDependency.getVersion(), c -> {
                                c.attributes(a -> a.attribute(noMod, true));
                            });
                        });
                        externalModuleDependency.setTransitive(false);
                    } else if (dep instanceof FileCollectionDependency) {
                        FileCollectionDependency fileCollectionDependency = (FileCollectionDependency) dep;
                        project.getDependencies().constraints(constraints -> {
                            constraints.add(parent.getName(), fileCollectionDependency.getFiles(), c -> {
                                c.attributes(a -> a.attribute(noMod, true));
                            });
                        });
                    } else if (dep instanceof ProjectDependency) {
                        ProjectDependency projectDependency = (ProjectDependency) dep;
                        project.getDependencies().constraints(constraints -> {
                            constraints.add(parent.getName(), projectDependency.getDependencyProject(), c -> {
                                c.attributes(a -> a.attribute(noMod, true));
                            });
                        });
                        projectDependency.setTransitive(false);
                    }
                })
            }
            
            implementation.extendsFrom(modCompileOnly)
            
            compileClasspath.attributes.attribute(noMod, false)
            runtimeClasspath.attributes.attribute(noMod, false)
            
            compileClasspath.extendsFrom(modCompileOnly)
            runtimeClasspath.extendsFrom(modCompileOnly)
        }
        
        project.dependencies {
            artifactTypes.maybeCreate("jar").attributes.attribute(noMod, false)
            attributesSchema {
                attribute(noMod)
            }
            registerTransform(DisableMod) {
                from.attributes.attribute(noMod, false)
                to.attributes.attribute(noMod, true)
            }
            if (project.modImplemented != "[]") {
                project.modImplemented.each { mod -> 
                    if (mod.disabled) {
                        add("modCompileOnly", mod.name)
                    } else {
                        add("implementation", mod.name)
                    }
                }
            }
        }
        
        def currentModId = project.mod_id
        def currentModName = project.mod_name
        def currentModVersion = project.mod_version
        def currentModDisplayUrl = project.mod_display_url
        def currentModAuthors = project.mod_authors
        def currentModDescription = project.mod_description
        def currentLoaderVersionRange = project.loader_version_range
        def currentGithubProject = project.github_project
        def currentModLicense = project.mod_license
        def currentForgeVersionRange = project.forge_version_range
        def currentMinecraftVersionRange = project.minecraft_version_range
        
        def currentResourcePackMin = project.resource_pack_min_format
        def currentResourcePackMax = project.resource_pack_max_format
        def currentDataPackFormat = project.data_pack_format
    
        def hasModProperties = project.hasProperty("modProperties") && project.modProperties != "[]" && project.modProperties != ""
        def currentModProperties = hasModProperties ? project.modProperties : []
    
        def hasModDependencies = project.hasProperty("modDependencies")
        def currentModDependencies = hasModDependencies ? project.modDependencies : null
    
        def hasModMixins = project.hasProperty("modMixins") && project.modMixins instanceof List && !project.modMixins.isEmpty()
        def currentModMixins = hasModMixins ? project.modMixins : null
        
        project.tasks.getByName("processResources") {    
            outputs.upToDateWhen { false }
            filesMatching('pack.mcmeta') {
                ResourceHelper.processJsonFile([
                    description: currentModName + " resources", 
                    min_format: currentResourcePackMin, 
                    max_format: currentResourcePackMax, 
                    "forge:data_pack_format": currentDataPackFormat
                ], getFile())
            }
            filesMatching('META-INF/neoforge.mods.toml') {
                def lines = [
                    'modLoader="javafml"',
                    'loaderVersion="' + currentLoaderVersionRange + '"',
                    'issueTrackerURL="https://github.com/' + currentGithubProject + '/issues"',
                    'license="' + currentModLicense + '"',
                    '',
                    '[[mods]]',
                    '    modId="' + currentModId + '"',
                    '    version="' + currentModVersion + '"',
                    '    displayName="' + currentModName + '"',
                    '    displayURL="' + currentModDisplayUrl + '"',
                    '    authors="' + currentModAuthors + '"',
                    "    description='''" + currentModDescription + "'''",
                    '    iconFile="' + currentModId + '.png"',
                ]
                
                if (hasModProperties) {
                    lines.addAll(currentModProperties)
                }
                
                lines.addAll([
                    '',
                    '[[dependencies.' + currentModId + ']]',
                    '    modId="neoforge"',
                    '    type="required"',
                    '    versionRange="' + currentForgeVersionRange + '"',
                    '    ordering="NONE"',
                    '    side="BOTH"',
                    '',
                    '[[dependencies.' + currentModId + ']]',
                    '    modId="minecraft"',
                    '    type="required"',
                    '    versionRange="' + currentMinecraftVersionRange + '"',
                    '    ordering="NONE"',
                    '    side="BOTH"',
                    '',
                ])
        
                if (hasModDependencies && currentModDependencies != null) {
                    currentModDependencies.each { dependency ->
                        lines.add('[[dependencies.' + currentModId + ']]')
                        dependency.each { entry ->
                            if (entry.value instanceof Boolean || entry.value instanceof Number) {
                                lines.add('   ' + entry.key + '=' + entry.value)
                            } else {
                                lines.add('   ' + entry.key + '="' + entry.value + '"')
                            }
                        }
                        lines.add('')
                    }                    
                }
        
                if (hasModMixins && currentModMixins != null) {
                    currentModMixins.each { config ->
                        lines.add('[[mixins]]')
                        lines.add('   config="' + config + '"')
                        lines.add('')  
                    }               
                }
                        
                BufferedWriter writer = new BufferedWriter(new FileWriter(getFile()))
                lines.each { line ->
                    writer.write(line)
                    writer.write("\r\n")
                }
                writer.close()
            }
        }
        
        project.java.withSourcesJar()
        
        def modFilePrefix = "NEOFORGE"
        if (project.hasProperty("mod_release_suffix") && project.mod_release_suffix != "") {
            modFilePrefix = project.mod_release_suffix
        }
        
        project.jar {
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
            archiveFileName.set(project.mod_name + "_" + modFilePrefix + "_v" + project.mod_version + "_mc" + project.minecraft_version + ".jar")
            manifest {
                attributes([
                    "Specification-Title": project.mod_name,
                    "Specification-Vendor": "CreativeMD",
                    "Specification-Version": project.mod_version,
                    "Implementation-Title": project.mod_name,
                    "Implementation-Version"  : project.mod_version,
                    "Implementation-Vendor": "CreativeMD",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
                ])
            }
        }
        
        project.sourcesJar {
             archiveFileName.set(project.mod_name + "_" + modFilePrefix + "_SOURCE_v" + project.mod_version + "_mc" + project.minecraft_version + ".jar")
             exclude('assets/*')
             exclude('data/*')
        }
        
        project.tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
        
        project.tasks.register('upload', GradleBuild) {
            description 'Uploads new version to modrinth and curseforge.'
            group = 'publishing'
            tasks = ['curseforge', 'modrinth']
        }
        
        project.gradle.taskGraph.whenReady {
            if (it.hasTask(project.tasks.modrinth) || (project.curse_id != "" && it.hasTask(project.tasks.curseforge))) {
                if (!getChangelogText(project)?.trim()) {
                    throw new GradleException('No changelog provided')
                }
            }
        }
        
        project.tasks.modrinth.enabled = System.getenv("MODRINTH_TOKEN") != null
        project.tasks.modrinth.group = 'publishing'
        project.modrinth {
            token = System.getenv("MODRINTH_TOKEN")
            if (project.hasProperty("modrinth_id")) {
                projectId = project.modrinth_id
            } else {
                projectId = project.mod_id
            }
            versionNumber = project.mod_version
            versionType = project.release_type
            uploadFile = project.jar
            gameVersions = [ project.minecraft_version ]
            changelog = getChangelogText(project)
            loaders = [ "neoforge" ]
            dependencies {
                if (project.hasProperty("modDependencies") && project.modDependencies instanceof List) {
                    project.modDependencies.each {
                        dependency -> {
                            required.project dependency["modId"]
                        }
                    }                    
                }
            }
            additionalFiles = [ project.sourcesJar ]
        }
        
        if(project.curse_id != "") {
            project.tasks.register("curseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
                group = 'publishing'
                apiToken = System.getenv("CURSEFORGE_TOKEN") != null ? System.getenv("CURSEFORGE_TOKEN") : "empty"
                disableVersionDetection()
                
                def mainFile = upload(project.curse_id, project.jar)
                mainFile.releaseType = project.release_type
                mainFile.changelog = getChangelogText(project)
                mainFile.changelogType = 'markdown'
                mainFile.addModLoader("NeoForge")
                mainFile.addGameVersion(project.minecraft_version)
                if (project.hasProperty("modSides") && project.modSides instanceof List && !project.modSides.isEmpty()) {
                    project.modSides.each {
                        side -> {
                            mainFile.addEnvironment(side)
                        }
                    }
                } else {
                    mainFile.addEnvironment("client", "server")
                }
                if (project.hasProperty("modDependencies") && project.modDependencies instanceof List && !project.modDependencies.isEmpty()) {
                    project.modDependencies.each {
                        dependency -> {
                            mainFile.addRequirement(dependency["modId"])
                        }
                    }
                }
                
                def sourcesFile = mainFile.withAdditionalFile(project.sourcesJar)
                sourcesFile.changelog = getChangelogText(project)
                sourcesFile.changelogType = 'markdown'
            }
        }
    }
}

String getChangelogText(project) {
    String result = ''
    boolean first = true
    project.file('changelog.txt').readLines().find {
        if (first) {
            if (it.equals(project.mod_version)) {
                first = false
            }
            return false
        } else if (!it?.trim()) {
            return true
        } else {
            result += "* " + it + "\n"
            return false
        }
    }
    
    return result
}
